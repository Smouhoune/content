# platform = multi_platform_all
# reboot = false
# strategy = restrict
# complexity = low
# disruption = low
{{%- set aide_init_command = aide_bin_path ~ " --init" -%}}
{{%- set aide_stage_src = aide_db_new_path -%}}
{{%- set aide_stage_dest = aide_db_path -%}}

{{% if 'sle' in product or 'slmicro' in product %}}
- name: "{{{ rule_title }}} - Ensure Repositories Are Updated"
  ansible.builtin.command: zypper -q --no-remote ref
  failed_when: false
{{% endif %}}

- name: "{{{ rule_title }}} - Ensure AIDE Is Installed"
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  with_items:
    - aide

- name: "{{{ rule_title }}} - Check Whether the Stock AIDE Database Exists"
  ansible.builtin.stat:
     path: {{{ aide_stage_src }}}
  register: aide_database_stat

- name: "{{{ rule_title }}} - Build and Test AIDE Database"
  ansible.builtin.command: {{{ aide_init_command }}}
  changed_when: True
  when: not (aide_database_stat.stat.exists is defined and aide_database_stat.stat.exists)
  register: aide_database_init

- name: "{{{ rule_title }}} - Stage AIDE Database"
  ansible.builtin.copy:
    src: {{{ aide_stage_src }}}
    dest: {{{ aide_stage_dest }}}
    backup: yes
    remote_src: yes
  when:
    - aide_database_init is changed
    - not ansible_check_mode
